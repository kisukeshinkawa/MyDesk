<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyDesk</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0070D4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ── DUSTALK global base (デザインカタログ準拠) ───────────────── */
      html, body {
        margin: 0;
        background: #F9FAFE;                 /* dustalk-surface */
        color: #212121;                      /* dustalk-text */
        font-family: 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* フォームやボタンも本文フォントを継承（Noto Sans JP） */
      button, input, select, textarea, optgroup {
        font-family: inherit;
        font-size: inherit;
      }
      /* ネイティブ チェックボックス/ラジオ/レンジ を DUSTALK ブルーに */
      input, select, textarea, progress, meter {
        accent-color: #579AFF;               /* dustalk-blue-dark */
      }
      /* テキスト選択色 */
      ::selection { background: #CFE3FF; color: #1563CA; }
      /* フォーカスリング（キーボード操作時）2px #60A5FA */
      button:focus-visible, a:focus-visible, [tabindex]:focus-visible,
      summary:focus-visible, [role="button"]:focus-visible {
        outline: 2px solid #60A5FA;          /* dustalk-focus-ring */
        outline-offset: 1px;
      }
      /* 入力欄フォーカス時の青グロー（全ネイティブ入力に適用） */
      input:focus, select:focus, textarea:focus {
        box-shadow: 0 0 8px rgba(0,112,212,0.18);   /* shadow-dustalk-input-focus */
      }
      /* ボタンの押下フィードバック */
      button { transition: background-color .12s, box-shadow .12s, border-color .12s, transform .05s; }
      button:not(:disabled):active { transform: translateY(0.5px); }
      /* リンク色 */
      a { color: #1563CA; }                  /* dustalk interactive-text */
      /* ── DUSTALK スクロールバー（thumb #B2BAC6 / hover #747474） ── */
      * { scrollbar-width: thin; scrollbar-color: #B2BAC6 transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #B2BAC6;                  /* dustalk-muted */
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #747474;                  /* dustalk-gray-500 */
        background-clip: padding-box;
        border: 2px solid transparent;
      }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyDesk" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230070D4'/><text y='.9em' font-size='75' x='12'>📋</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => { console.log('[SW] Registered:', reg.scope); })
            .catch(err => { console.warn('[SW] Registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
